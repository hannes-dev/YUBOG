<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yubog</title>
</head>

<body>
    <div id="module_box">
        <div class="module center">
            <div id="timer" class="timer center">timer</div>
            <div id="strike_container"></div>
        </div>
    </div>
    <p id="serial"></p>
</body>

<script type="module">
    import Bomb from "./BombLib.js";
    let modules = ["./modules/yes_no/module.html", "./modules/yes_no/module.html" ,"./modules/yes_no/module.html"];
    let module_frames = [];

    for (const module of modules) {
        let iframe = document.createElement("iframe");
        iframe.src = module;
        iframe.className = "module";
        module_box.appendChild(iframe);
        module_frames.push(iframe);
    }

    const STRIKES_ALLOWED = 2;
    const BOMB_TIME_S = 2*60;

    const bomb = new Bomb(module_frames, BOMB_TIME_S, STRIKES_ALLOWED);

    const strike_container = document.getElementById("strike_container");
    for (let i = 0; i < STRIKES_ALLOWED; i++) {
        strike_container.innerHTML += '<div id="strike">X<div>';
    }

    const timer = document.getElementById("timer");
    
    window.addEventListener("tick", () => {
        timer.innerHTML = bomb.time_left_string;
    });
    window.addEventListener("explode", () => timer.innerHTML = "BOOM!");
    window.addEventListener("solved", () => timer.innerHTML = "SOLVED");

    document.getElementById("serial").innerText = bomb.serial;

    bomb.start();

</script>

<style>
    #module_box {
        display: flex;
    }

    .module {
        background-color: gray;
        aspect-ratio: 1/1;
        width: 20%;
        border: none;
        border-radius: 10%;
        margin: 2vmin;
    }

    .timer {
        font-family: monospace;
        font-size: 6vmin;
        color: red;
        background-color: black;
        padding: 10% 5%;
        width: 70%;
    }

    body {
        color: white;
        background-color: #121212;
        font-family: sans-serif;
        user-select: none;
        font-size: 10vmin;
    }

    .center {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .solved {
        background-color: greenyellow;
    }
</style>

</html>
